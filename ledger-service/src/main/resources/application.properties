# =============================================================================
# ledger-service: configuração
#
# Prefixos de profile do Quarkus:
#   (sem prefixo) vale para todos os profiles
#   %dev          ./mvnw quarkus:dev (veja scripts/dev.sh)
#   %test         testes automatizados
#   %prod         jar empacotado / container
#   %dev,prod     vale para os dois profiles listados
#
# Endereços e senhas NUNCA ficam aqui: vêm de variáveis de ambiente
# (arquivo .env local, fora do git; modelo em .env.example).
# =============================================================================

quarkus.application.name=ledger-service
quarkus.http.port=8082
# Porta aleatória nos testes, para módulos diferentes poderem rodar em paralelo
quarkus.http.test-port=0

# Mensagens (inclusive as de validação) em português
quarkus.default-locale=pt-BR
quarkus.locales=pt-BR

# -----------------------------------------------------------------------------
# Banco de dados (ADR-0002: database e usuário exclusivos deste serviço)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
# Em dev e prod a conexão vem das variáveis de ambiente. Se alguma faltar, o
# serviço não sobe: falhar cedo é melhor que subir sem banco.
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${FINATOR_DB_HOST}:${FINATOR_DB_PORT:5432}/${LEDGER_DB_NAME:finator_ledger}
%dev,prod.quarkus.datasource.username=${LEDGER_DB_USER}
%dev,prod.quarkus.datasource.password=${LEDGER_DB_PASSWORD}
# Sem esta verificação, uma variável faltando faz o Quarkus desativar o datasource
# em silêncio (ver RequiredConfigCheck no finator-commons).
%dev,prod.finator.startup.required-properties=quarkus.datasource.jdbc.url,quarkus.datasource.username,quarkus.datasource.password
# Nos testes não há URL configurada, então o Quarkus Dev Services sobe um
# PostgreSQL descartável em container (exige Docker).

# Pool de conexões (Agroal). Poucas conexões bastam: cada uma ocupa memória no
# PostgreSQL. O tamanho certo será medido nos testes de carga (0.12.0).
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10

# -----------------------------------------------------------------------------
# Migrações (Flyway)
# Tudo deste serviço fica no schema "ledger"; o Flyway cria o schema se não existir.
# -----------------------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=ledger
quarkus.flyway.default-schema=ledger

# -----------------------------------------------------------------------------
# Contrato OpenAPI: /q/openapi (Swagger UI em /q/swagger-ui, só em dev)
# -----------------------------------------------------------------------------
quarkus.smallrye-openapi.info-title=Finator Ledger API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Contas, categorias, títulos a receber e a pagar, parcelas e efetivações.
